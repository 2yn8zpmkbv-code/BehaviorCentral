<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavioral Sciences Directory</title>
<style>
  :root {
    --maroon: #943937;
    --ink: #222;
    --muted: #5a5a5a;
    --line: #e4e4e4;
    --stripe: #faf6f6;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  .wrap { max-width: 1000px; padding: 8px 12px 24px; }

  /* Tabs */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 4px;
    border-bottom: 2px solid var(--maroon);
    margin-bottom: 16px;
  }
  .tab {
    appearance: none; border: 1px solid var(--line); border-bottom: none;
    background: #f4f4f4; color: var(--muted);
    padding: 8px 14px; font: inherit; font-size: 0.95em; font-weight: 600;
    border-radius: 8px 8px 0 0; cursor: pointer;
  }
  .tab:hover { color: var(--maroon); }
  .tab[aria-selected="true"] { background: var(--maroon); color: #fff; border-color: var(--maroon); }
  .tab:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

  .intro { margin: 0 0 12px; font-weight: 600; }
  h2 {
    margin: 22px 0 8px; padding: 4px 10px;
    border-left: 5px solid var(--maroon);
    color: var(--maroon); font-size: 1.2em;
  }
  .panel > h2:first-child { margin-top: 0; }

  /* Table (desktop) */
  table { width: 100%; border-collapse: collapse; font-size: 0.92em; }
  th {
    text-align: left; font-size: 0.82em; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); padding: 6px 10px; border-bottom: 2px solid var(--line);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  .name { font-weight: 700; }
  .name a { color: var(--maroon); text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .role { display: block; color: var(--muted); font-size: 0.9em; font-weight: 400; }
  .li { font-size: 0.78em; font-weight: 600; margin-left: 6px; color: #0a66c2; }
  td a[href^="mailto"] { color: var(--maroon); word-break: break-all; }
  .col-name { width: 32%; }
  .col-email { width: 26%; }
  .col-office { width: 18%; }

  /* Stacked list (phones) */
  @media (max-width: 640px) {
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr {
      border: 1px solid var(--line); border-left: 4px solid var(--maroon);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; background: #fff !important;
    }
    td { border: none; padding: 2px 0; display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
    td::before {
      content: attr(data-label); color: var(--maroon);
      font-size: 0.8em; font-weight: 700; padding-top: 2px;
    }
    td.name { display: block; padding-bottom: 6px; font-size: 1.05em; }
    td.name::before { content: none; }
    td:empty { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Departments" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>

      { name: "Dr. Angel Munoz", role: "Behavior Central Webmaster, Psychology Data Analytics, and Psychology Club Advisor", email: "amunozgomezandrade", office: "Kenan Hall, Room 341", hours: "MWF: 10:15–11:45AM" },

    groups: [

        { name: "Dr. Angel Munoz", role: "Assistant Professor", email: "amunozgomezandrade", office: "Kenan Hall, Room 341", hours: "MWF: 10:15–11:45AM" },

      ]},

        { name: "Amanda Barnes", role: "Adjunct Professor", email: "ambarnes", office: "Kenan Hall", hours: "By appointment only" },

        { name: "Joseph Pietropaolo", role: "Adjunct Professor", email: "jpietropaolo", office: "Pollard Hall, Lobby", hours: "M&W: 2–3:30PM; F: 2–3PM" },

  {

      { title: "Full-Time Professors", people: [
        { name: "Dr. Jen Melvin", role: "Program Director; Associate Professor of Sociology", email: "jmelvin", office: "Kenan Hall, Room 310", hours: "M–R: 8–9AM" },
        { name: "Dr. Leonard Steverson", role: "Associate Professor of Sociology", email: "lsteverson", office: "Kenan Hall, Room 340", hours: "M: 10–11AM & 1–2PM; T, W, R: 10–11AM" },
        { name: "Dr. Yiorgo Topalidis", role: "Visiting Lecturer (SOC & CORE)", email: "ytopalidis", office: "Wiley Hall, Room 208", hours: "M–R: 4–5PM" }
      ]}
    ]

  {
    id: "advising", label: "Advising Affiliates",

    groups: [{ title: null, people: [
      { name: "Dr. Justin Capes", role: "Associate Professor", email: "jcapes", office: "Kenan Hall, Room 509" },
      { name: "Dr. Eugenia Charoni", role: "Associate Professor", email: "echaroni", office: "Kenan Hall, Room 342" },
      { name: "Dr. Jill Dawson", role: "Academic Access & Success", email: "jdawson", office: "Proctor Library, L-350" },
      { name: "Dr. James Rowell", role: "Associate Professor", email: "jrowell", office: "Kenan Hall, Room 516" },

    ]}]
  }
];
/* ============================ END EDIT ============================ */

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function row(p) {
  const email = p.email.includes("@") ? p.email : p.email + "@flagler.edu";
  const office = p.office || ADJ_OFFICE;
  const hours = (p.hours || "").split(";").map(h => esc(h.trim())).filter(Boolean).join("<br>");
  const name = esc(p.name);
  const li = p.linkedin
    ? `<a class="li" href="${p.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn profile of ${esc(p.name)}">LinkedIn</a>`
    : "";
  return `<tr>
    <td class="name">${name}${li}<span class="role">${esc(p.role)}</span></td>
    <td data-label="Email"><a href="mailto:${email}">${email}</a></td>
    <td data-label="Office">${esc(office)}</td>
    <td data-label="Hours">${hours}</td>
  </tr>`;
}

function table(people) {
  return `<table>
    <thead><tr>
      <th class="col-name" scope="col">Name</th>
      <th class="col-email" scope="col">Email</th>
      <th class="col-office" scope="col">Office</th>
      <th scope="col">Office Hours</th>
    </tr></thead>
    <tbody>${people.map(row).join("")}</tbody>
  </table>`;
}

const tabsEl = document.getElementById("tabs");
const panelsEl = document.getElementById("panels");

DEPARTMENTS.forEach(d => {
  const btn = document.createElement("button");
  btn.className = "tab"; btn.type = "button";
  btn.id = "tab-" + d.id; btn.setAttribute("role", "tab");
  btn.setAttribute("aria-controls", "panel-" + d.id);
  btn.textContent = d.label;
  btn.addEventListener("click", () => select(d.id, true));
  tabsEl.appendChild(btn);

  const panel = document.createElement("section");
  panel.className = "panel"; panel.id = "panel-" + d.id;
  panel.setAttribute("role", "tabpanel");
  panel.setAttribute("aria-labelledby", "tab-" + d.id);
  panel.innerHTML =
    (d.intro ? `<p class="intro">${esc(d.intro)}</p>` : "") +
    d.groups.map(g => (g.title ? `<h2>${esc(g.title)}</h2>` : "") + table(g.people)).join("");
  panelsEl.appendChild(panel);
});

function select(id, focus) {
  DEPARTMENTS.forEach(d => {
    const on = d.id === id;
    const t = document.getElementById("tab-" + d.id);
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
    document.getElementById("panel-" + d.id).hidden = !on;
    if (on && focus) t.focus();
  });
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}

tabsEl.addEventListener("keydown", e => {
  const ids = DEPARTMENTS.map(d => d.id);
  const cur = ids.indexOf(document.activeElement.id.replace("tab-", ""));
  if (cur < 0) return;
  let next = null;
  if (e.key === "ArrowRight") next = (cur + 1) % ids.length;
  if (e.key === "ArrowLeft") next = (cur - 1 + ids.length) % ids.length;
  if (e.key === "Home") next = 0;
  if (e.key === "End") next = ids.length - 1;
  if (next !== null) { e.preventDefault(); select(ids[next], true); }
});

const start = location.hash.slice(1);
select(DEPARTMENTS.some(d => d.id === start) ? start : DEPARTMENTS[0].id, false);
</script>
</body>
</html>
